name: 🐞 Bug report
description: Something is not working as expected
labels: ["type/bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, browser, version / commit"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
